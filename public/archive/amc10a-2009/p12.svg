<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Quadrilateral ABCD">
  <rect width="100%" height="100%" fill="#fbfaf7"/>
  <style>
    .line{stroke:#071a3a;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#274d9f;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .shade{fill:#f5c56b;fill-opacity:.35;stroke:#071a3a;stroke-width:3}
    .label{font:18px Georgia,serif;fill:#071a3a;font-weight:700}
    .small{font:14px Inter,Arial,sans-serif;fill:#34466a}
  </style>
  
  <polygon class="thin" points="95,220 235,60 430,210 245,245" fill="#fff"/>
  <line class="line" x1="95" y1="220" x2="430" y2="210"/>
  <line class="line" x1="235" y1="60" x2="245" y2="245"/>
  <text class="label" x="80" y="242">A</text><text class="label" x="225" y="50">B</text><text class="label" x="435" y="215">C</text><text class="label" x="244" y="268">D</text>
  <text class="small" x="150" y="130">9</text><text class="small" x="330" y="128">17</text><text class="small" x="335" y="238">5</text><text class="small" x="148" y="245">5</text>
</svg>
