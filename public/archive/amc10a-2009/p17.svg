<svg xmlns="http://www.w3.org/2000/svg" width="520" height="300" viewBox="0 0 520 300" role="img" aria-label="Rectangle construction">
  <rect width="100%" height="100%" fill="#fbfaf7"/>
  <style>
    .line{stroke:#071a3a;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .thin{stroke:#274d9f;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .shade{fill:#f5c56b;fill-opacity:.35;stroke:#071a3a;stroke-width:3}
    .label{font:18px Georgia,serif;fill:#071a3a;font-weight:700}
    .small{font:14px Inter,Arial,sans-serif;fill:#34466a}
  </style>
  
  <rect x="120" y="100" width="180" height="135" fill="#fff" stroke="#071a3a" stroke-width="3"/>
  <line class="line" x1="120" y1="235" x2="300" y2="100"/>
  <line class="thin" x1="120" y1="235" x2="120" y2="25"/>
  <line class="thin" x1="120" y1="235" x2="420" y2="235"/>
  <line class="line" x1="120" y1="25" x2="420" y2="235"/>
  <text class="label" x="105" y="96">A</text><text class="label" x="305" y="100">B</text><text class="label" x="304" y="254">C</text><text class="label" x="100" y="254">D</text><text class="label" x="99" y="23">E</text><text class="label" x="426" y="242">F</text>
</svg>
